<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Edit Modal — School CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            canvas: '#FFF8F2',
            surface: '#FFFFFF',
            border: '#EAD8C7',
            charcoal: '#121417',
            muted: '#687787',
            terracotta: '#E07A5F',
            mint: '#90BE6D',
            marigold: '#FDBA3B',
            cerulean: '#64B5F6',
            lilac: '#B39DDB',
            cream: '#FAF0E6',
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['Fraunces', 'serif'],
          },
          boxShadow: {
            warm: '0 4px 20px -2px rgba(18, 20, 23, 0.05), 0 2px 6px -1px rgba(18, 20, 23, 0.03)',
            'warm-lg': '0 20px 40px -6px rgba(18, 20, 23, 0.12), 0 8px 16px -4px rgba(18, 20, 23, 0.06)',
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
      display: inline-flex;
      vertical-align: middle;
    }
    .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #E07A5F;
      box-shadow: 0 0 0 3px rgba(224, 122, 95, 0.18);
    }
  </style>
</head>
<body class="bg-canvas text-charcoal font-sans min-h-screen antialiased flex flex-col items-center justify-center p-4 sm:p-6 lg:p-8">

  <!-- Background Ambience -->
  <div class="fixed inset-0 pointer-events-none opacity-20 filter blur-[2px]">
    <div class="p-8 max-w-7xl mx-auto space-y-6">
      <div class="h-16 bg-white border border-border rounded-2xl"></div>
      <div class="h-96 bg-white border border-border rounded-2xl"></div>
    </div>
  </div>

  <!-- Modal Backdrop -->
  <div class="fixed inset-0 bg-charcoal/50 backdrop-blur-sm z-40 transition-opacity"></div>

  <!-- Student Edit Dialog -->
  <div role="dialog" aria-modal="true" class="relative z-50 w-full max-w-3xl bg-white border border-border rounded-3xl shadow-warm-lg overflow-hidden flex flex-col max-h-[92vh]">

    <!-- Header -->
    <div class="bg-canvas/80 border-b border-border p-5 sm:p-6">
      <div class="flex items-center justify-between gap-4">
        <div class="flex items-center gap-3.5">
          <div class="w-12 h-12 rounded-2xl bg-terracotta/20 text-terracotta flex items-center justify-center font-serif text-lg font-bold shrink-0 border border-terracotta/30">
            <span class="material-symbols-outlined text-2xl text-terracotta">manage_accounts</span>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h2 class="text-xl font-bold font-serif text-charcoal">Edit Student Record</h2>
              <span class="px-2 py-0.5 rounded-full bg-cream text-charcoal text-[10px] font-bold border border-border">#STU-2026-0891</span>
            </div>
            <p class="text-xs text-muted mt-0.5">Modify demographic data, classroom section assignment, and enrollment lifecycle status.</p>
          </div>
        </div>

        <a href="Student_Directory_Widget.html" class="w-8 h-8 rounded-full bg-white border border-border flex items-center justify-center text-muted hover:text-charcoal transition-colors hover:bg-cream" title="Close">
          <span class="material-symbols-outlined text-lg">close</span>
        </a>
      </div>
    </div>

    <!-- Edit Form Body -->
    <form id="editForm" onsubmit="event.preventDefault(); saveStudentUpdates();" class="flex-1 overflow-y-auto p-6 space-y-6">
      
      <!-- Section 1: Names & Identity -->
      <div>
        <h3 class="text-xs font-bold uppercase tracking-wider text-charcoal mb-3">Legal &amp; Preferred Name Identification</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-charcoal mb-1">First / Given Name <span class="text-terracotta">*</span></label>
            <input type="text" id="editFirstName" value="Sophia" required class="w-full px-3 py-2 text-xs bg-canvas border border-border rounded-xl font-semibold text-charcoal">
          </div>
          <div>
            <label class="block text-xs font-bold text-charcoal mb-1">Middle Name</label>
            <input type="text" id="editMiddleName" value="Claire" class="w-full px-3 py-2 text-xs bg-canvas border border-border rounded-xl font-semibold text-charcoal">
          </div>
          <div>
            <label class="block text-xs font-bold text-charcoal mb-1">Last / Family Name <span class="text-terracotta">*</span></label>
            <input type="text" id="editLastName" value="Chen" required class="w-full px-3 py-2 text-xs bg-canvas border border-border rounded-xl font-semibold text-charcoal">
          </div>
          <div>
            <label class="block text-xs font-bold text-charcoal mb-1">Preferred Name / Nickname</label>
            <input type="text" id="editPrefName" value="Sophie" class="w-full px-3 py-2 text-xs bg-canvas border border-border rounded-xl font-semibold text-charcoal">
          </div>
        </div>
      </div>

      <!-- Section 2: Demographics & Residential -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-bold text-charcoal mb-1">Date of Birth <span class="text-terracotta">*</span></label>
          <input type="date" value="2019-04-12" required class="w-full px-3 py-2 text-xs bg-canvas border border-border rounded-xl font-semibold text-charcoal">
        </div>
        <div>
          <label class="block text-xs font-bold text-charcoal mb-1">Gender Identity</label>
          <select class="w-full px-3 py-2 text-xs bg-canvas border border-border rounded-xl font-semibold text-charcoal">
            <option selected>Female</option>
            <option>Male</option>
            <option>Non-binary</option>
            <option>Prefer not to say</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-charcoal mb-1">OEN (Ministry Registry)</label>
          <input type="text" value="892-104-551" class="w-full px-3 py-2 text-xs bg-canvas border border-border rounded-xl font-mono text-charcoal">
        </div>
        <div class="sm:col-span-3">
          <label class="block text-xs font-bold text-charcoal mb-1">Primary Home Address</label>
          <input type="text" value="482 Bloor Street West, Suite 400, Toronto, ON M5S 1X8" class="w-full px-3 py-2 text-xs bg-canvas border border-border rounded-xl font-semibold text-charcoal">
        </div>
      </div>

      <!-- Section 3: Classroom Assignment & Status -->
      <div class="p-4 rounded-2xl bg-canvas border border-border space-y-4">
        <h3 class="text-xs font-bold uppercase tracking-wider text-charcoal">Grade Assignment &amp; Enrollment Lifecycle</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-charcoal mb-1">Current Homeroom &amp; Section <span class="text-terracotta">*</span></label>
            <select class="w-full px-3 py-2 text-xs bg-white border border-border rounded-xl font-bold text-charcoal">
              <option>Grade 2A — Rm 102 (Mr. Harris)</option>
              <option selected>Grade 2B — Rm 2B (Ms. Hawthorne / IB PYP)</option>
              <option>Grade 2C — Rm 106 (Mrs. Sterling)</option>
            </select>
            <span class="text-[10px] text-muted mt-1 block">Class capacity: 18 / 20 seats enrolled</span>
          </div>

          <div>
            <label class="block text-xs font-bold text-charcoal mb-1">Enrollment Lifecycle Status <span class="text-terracotta">*</span></label>
            <select id="editStatus" class="w-full px-3 py-2 text-xs bg-white border border-border rounded-xl font-bold text-charcoal">
              <option value="Active" selected>Active (Full Standing)</option>
              <option value="Conditional">Conditional (Documentation Pending)</option>
              <option value="Probation">Academic / Attendance Probation</option>
              <option value="Withdrawn">Withdrawn / Transferred Out</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-charcoal mb-1">Mandatory Audit Justification / Reason for Change <span class="text-terracotta">*</span></label>
          <textarea rows="2" required placeholder="State regulatory or administrative justification for editing this student record..." class="w-full px-3 py-2 text-xs bg-white border border-border rounded-xl text-charcoal">Annual address and preferred name confirmation verified by registrar.</textarea>
        </div>
      </div>

      <!-- Action Footer -->
      <div class="pt-2 flex items-center justify-between border-t border-border">
        <a href="Student_Directory_Widget.html" class="px-4 py-2.5 rounded-xl border border-border bg-white text-charcoal font-semibold text-xs hover:bg-cream transition-colors">
          Discard Changes
        </a>
        <button type="submit" class="px-6 py-2.5 rounded-xl bg-terracotta text-white font-bold text-xs hover:bg-terracotta/90 transition-all flex items-center gap-1.5 shadow-warm">
          <span class="material-symbols-outlined text-sm">save</span>
          Save Updates &amp; Log Audit Event
        </button>
      </div>
    </form>
  </div>

  <script>
    function saveStudentUpdates() {
      alert('Student record #STU-2026-0891 updated successfully!\nAudit trail entry logged under Registrar credentials.');
      window.location.href = 'Student_Directory_Widget.html';
    }
  </script>
</body>
</html>
