<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment &amp; Homework Modal — School CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            canvas: '#FFF8F2',
            surface: '#FFFFFF',
            border: '#EAD8C7',
            charcoal: '#121417',
            muted: '#687787',
            terracotta: '#E07A5F',
            mint: '#90BE6D',
            marigold: '#FDBA3B',
            cerulean: '#64B5F6',
            lilac: '#B39DDB',
            cream: '#FAF0E6',
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['Fraunces', 'serif'],
          },
          boxShadow: {
            warm: '0 4px 20px -2px rgba(18, 20, 23, 0.05), 0 2px 6px -1px rgba(18, 20, 23, 0.03)',
            'warm-lg': '0 20px 40px -6px rgba(18, 20, 23, 0.12), 0 8px 16px -4px rgba(18, 20, 23, 0.06)',
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
      display: inline-flex;
      vertical-align: middle;
    }
    .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #E07A5F;
      box-shadow: 0 0 0 3px rgba(224, 122, 95, 0.18);
    }
  </style>
</head>
<body class="bg-canvas text-charcoal font-sans min-h-screen antialiased flex flex-col items-center justify-center p-4 sm:p-6 lg:p-8">

  <!-- Background Ambience -->
  <div class="fixed inset-0 pointer-events-none opacity-20 filter blur-[2px]">
    <div class="p-8 max-w-7xl mx-auto space-y-6">
      <div class="h-16 bg-white border border-border rounded-2xl"></div>
      <div class="h-96 bg-white border border-border rounded-2xl"></div>
    </div>
  </div>

  <!-- Modal Backdrop -->
  <div class="fixed inset-0 bg-charcoal/50 backdrop-blur-sm z-40 transition-opacity"></div>

  <!-- Assignment Modal Dialog -->
  <div role="dialog" aria-modal="true" class="relative z-50 w-full max-w-3xl bg-white border border-border rounded-3xl shadow-warm-lg overflow-hidden flex flex-col max-h-[92vh]">

    <!-- Header -->
    <div class="bg-canvas/80 border-b border-border p-5 sm:p-6">
      <div class="flex items-center justify-between gap-4">
        <div class="flex items-center gap-3.5">
          <div class="w-12 h-12 rounded-2xl bg-marigold/20 text-charcoal flex items-center justify-center font-serif text-lg font-bold shrink-0 border border-marigold/40">
            <span class="material-symbols-outlined text-2xl text-charcoal">assignment_add</span>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h2 class="text-xl font-bold font-serif text-charcoal">Create Assignment &amp; Homework Task</h2>
              <span class="px-2 py-0.5 rounded-full bg-cream text-charcoal text-[10px] font-bold border border-border">Grade 5 Science</span>
            </div>
            <p class="text-xs text-muted mt-0.5">Publish coursework to Student and Parent Portals with grading criteria and attachments.</p>
          </div>
        </div>

        <a href="Curriculum_Planner_Widget.html" class="w-8 h-8 rounded-full bg-white border border-border flex items-center justify-center text-muted hover:text-charcoal transition-colors hover:bg-cream" title="Close">
          <span class="material-symbols-outlined text-lg">close</span>
        </a>
      </div>
    </div>

    <!-- Form Body -->
    <form id="assignForm" onsubmit="event.preventDefault(); publishAssignment();" class="flex-1 overflow-y-auto p-6 space-y-5 text-xs">

      <!-- Title & Target Section -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div class="sm:col-span-2">
          <label class="block text-[11px] font-bold uppercase tracking-wider text-charcoal mb-1">Assignment Title <span class="text-terracotta">*</span></label>
          <input type="text" value="Lab Investigation Report: Home Barometer Calibration" required class="w-full px-3 py-2 text-xs bg-canvas border border-border rounded-xl font-bold text-charcoal">
        </div>
        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-charcoal mb-1">Target Section</label>
          <select class="w-full px-3 py-2 text-xs bg-canvas border border-border rounded-xl font-semibold text-charcoal">
            <option selected>Grade 5A &amp; 5B (Both)</option>
            <option>Grade 5A only</option>
            <option>Grade 5B only</option>
          </select>
        </div>
      </div>

      <!-- Description / Instructions -->
      <div>
        <label class="block text-[11px] font-bold uppercase tracking-wider text-charcoal mb-1">Instructions for Students &amp; Families</label>
        <textarea rows="3" class="w-full px-3 py-2 text-xs bg-canvas border border-border rounded-xl text-charcoal leading-relaxed">Using the homemade aneroid balloon barometer constructed during Period 2, record pressure readings at 8:00 AM and 8:00 PM for four consecutive days. Complete the isobar correlation chart and answer discussion questions 1–4 on Page 3 of the lab sheet.</textarea>
      </div>

      <!-- Dates, Points & Weights -->
      <div class="p-4 rounded-2xl bg-canvas border border-border grid grid-cols-2 sm:grid-cols-4 gap-3">
        <div>
          <label class="block text-[10px] font-bold uppercase text-muted mb-1">Due Date</label>
          <input type="date" value="2026-11-13" required class="w-full px-2.5 py-1.5 text-xs bg-white border border-border rounded-lg font-semibold text-charcoal">
        </div>
        <div>
          <label class="block text-[10px] font-bold uppercase text-muted mb-1">Deadline Time</label>
          <input type="time" value="17:00" class="w-full px-2.5 py-1.5 text-xs bg-white border border-border rounded-lg font-semibold text-charcoal">
        </div>
        <div>
          <label class="block text-[10px] font-bold uppercase text-muted mb-1">Total Max Marks</label>
          <input type="number" value="50" class="w-full px-2.5 py-1.5 text-xs bg-white border border-border rounded-lg font-bold text-charcoal">
        </div>
        <div>
          <label class="block text-[10px] font-bold uppercase text-muted mb-1">Term Grade Weight</label>
          <div class="flex items-center gap-1">
            <input type="number" value="10" class="w-full px-2.5 py-1.5 text-xs bg-white border border-border rounded-lg font-bold text-charcoal">
            <span class="text-xs font-bold text-muted">%</span>
          </div>
        </div>
      </div>

      <!-- Submission Format & Rubric -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="p-4 rounded-xl border border-border bg-white space-y-2">
          <label class="block text-xs font-bold text-charcoal">Submission Format</label>
          <div class="space-y-1.5">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="subType" value="online" checked class="text-terracotta">
              <span>Digital PDF / Photo Upload via Student Portal</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="subType" value="paper" class="text-terracotta">
              <span>Physical Paper Hand-in (In Classroom Box)</span>
            </label>
          </div>
        </div>

        <div class="p-4 rounded-xl border border-border bg-white space-y-2">
          <label class="block text-xs font-bold text-charcoal">Rubric &amp; Worksheets Attached</label>
          <div class="flex items-center justify-between p-2 rounded-lg bg-canvas border border-border text-[11px]">
            <span class="flex items-center gap-1.5 truncate">
              <span class="material-symbols-outlined text-sm text-terracotta">picture_as_pdf</span>
              Barometer_Calibration_Rubric.pdf
            </span>
            <span class="text-mint font-bold text-[10px]">Attached</span>
          </div>
        </div>
      </div>

      <!-- Parent Notification Toggle -->
      <div class="p-3.5 rounded-xl bg-cream/40 border border-border flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="material-symbols-outlined text-marigold text-lg">notifications_active</span>
          <span class="text-xs font-bold text-charcoal">Send Parent Portal Homework Reminder</span>
        </div>
        <input type="checkbox" checked class="w-4 h-4 text-terracotta rounded">
      </div>

      <!-- Action Footer -->
      <div class="pt-2 flex items-center justify-between border-t border-border">
        <a href="Curriculum_Planner_Widget.html" class="px-4 py-2.5 rounded-xl border border-border bg-white text-charcoal font-semibold text-xs hover:bg-cream transition-colors">
          Cancel
        </a>
        <button type="submit" class="px-6 py-2.5 rounded-xl bg-terracotta text-white font-bold text-xs hover:bg-terracotta/90 transition-all flex items-center gap-1.5 shadow-warm">
          <span class="material-symbols-outlined text-sm">send</span>
          Publish Assignment to 38 Students
        </button>
      </div>
    </form>
  </div>

  <script>
    function publishAssignment() {
      alert('Assignment "Lab Investigation Report: Home Barometer Calibration" published!\nSync sent to 38 student diaries and parent portal.');
      window.location.href = 'Curriculum_Planner_Widget.html';
    }
  </script>
</body>
</html>
