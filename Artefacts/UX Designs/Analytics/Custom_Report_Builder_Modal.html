<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Report Builder Modal — School CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            canvas: '#fff8f2',
            surface: '#ffffff',
            border: '#ead8c7',
            charcoal: '#121417',
            terracotta: '#e07a5f',
            mint: '#90be6d',
            marigold: '#fdba3b',
            cerulean: '#64b5f6',
            lilac: '#b39ddb',
            cream: '#faf0e6'
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Fraunces"', 'serif']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-canvas text-charcoal font-sans min-h-screen p-4 md:p-8 flex items-center justify-center">

  <div class="relative w-full max-w-4xl bg-surface border border-border rounded-2xl shadow-xl overflow-hidden">
    
    <!-- Modal Header -->
    <div class="px-6 py-5 border-b border-border bg-canvas/60 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-terracotta/20 text-terracotta flex items-center justify-center">
          <span class="material-symbols-outlined text-2xl">table_chart_view</span>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h2 class="font-serif text-xl font-bold text-charcoal">Custom Report & Data Export Builder</h2>
            <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-cerulean/20 text-blue-800 border border-cerulean/40">Query Engine v2.4</span>
          </div>
          <p class="text-xs text-charcoal/60 mt-0.5">Select data domain projections, filters, and export formatted CSV, XLSX, or executive PDF</p>
        </div>
      </div>
      <button class="w-8 h-8 rounded-lg hover:bg-border/40 text-charcoal/60 flex items-center justify-center">
        <span class="material-symbols-outlined text-xl">close</span>
      </button>
    </div>

    <!-- Report Builder Form Content -->
    <div class="p-6 space-y-5 max-h-[62vh] overflow-y-auto">

      <!-- Step 1: Select Data Domain -->
      <div class="space-y-2">
        <label class="text-xs font-bold text-charcoal uppercase tracking-wider block">1. Select Data Domain</label>
        <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 text-xs">
          <label class="p-3 rounded-xl border border-terracotta bg-terracotta/10 flex flex-col items-center text-center cursor-pointer">
            <input type="radio" name="domain" checked class="sr-only">
            <span class="material-symbols-outlined text-terracotta text-2xl mb-1">school</span>
            <span class="font-bold text-terracotta">Students</span>
            <span class="text-[10px] text-charcoal/60 mt-0.5">Enrollment & Roster</span>
          </label>

          <label class="p-3 rounded-xl border border-border bg-canvas/30 hover:bg-canvas flex flex-col items-center text-center cursor-pointer">
            <input type="radio" name="domain" class="sr-only">
            <span class="material-symbols-outlined text-charcoal/70 text-2xl mb-1">co_present</span>
            <span class="font-semibold text-charcoal">Attendance</span>
            <span class="text-[10px] text-charcoal/60 mt-0.5">Absence & Tardy Logs</span>
          </label>

          <label class="p-3 rounded-xl border border-border bg-canvas/30 hover:bg-canvas flex flex-col items-center text-center cursor-pointer">
            <input type="radio" name="domain" class="sr-only">
            <span class="material-symbols-outlined text-charcoal/70 text-2xl mb-1">grade</span>
            <span class="font-semibold text-charcoal">Academics</span>
            <span class="text-[10px] text-charcoal/60 mt-0.5">Grades & Marks</span>
          </label>

          <label class="p-3 rounded-xl border border-border bg-canvas/30 hover:bg-canvas flex flex-col items-center text-center cursor-pointer">
            <input type="radio" name="domain" class="sr-only">
            <span class="material-symbols-outlined text-charcoal/70 text-2xl mb-1">payments</span>
            <span class="font-semibold text-charcoal">Billing</span>
            <span class="text-[10px] text-charcoal/60 mt-0.5">Invoices & Collections</span>
          </label>

          <label class="p-3 rounded-xl border border-border bg-canvas/30 hover:bg-canvas flex flex-col items-center text-center cursor-pointer">
            <input type="radio" name="domain" class="sr-only">
            <span class="material-symbols-outlined text-charcoal/70 text-2xl mb-1">badge</span>
            <span class="font-semibold text-charcoal">Staff / HR</span>
            <span class="text-[10px] text-charcoal/60 mt-0.5">Vetting & Payroll</span>
          </label>
        </div>
      </div>

      <!-- Step 2: Date Filters & Cohort Scope -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-bold text-charcoal mb-1">Reporting Date Window</label>
          <select class="w-full px-3 py-2 text-xs bg-canvas/40 border border-border rounded-lg font-medium text-charcoal">
            <option>Current Academic Year (2026–2027)</option>
            <option>Term 1 (Sep 01, 2026 – Dec 18, 2026)</option>
            <option>Past 30 Days</option>
            <option>Custom Date Range...</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-charcoal mb-1">Grade / Cohort Filter</label>
          <select class="w-full px-3 py-2 text-xs bg-canvas/40 border border-border rounded-lg font-medium text-charcoal">
            <option>All Grades (JK through Grade 12)</option>
            <option>Primary Division (JK – Grade 3)</option>
            <option>Junior Division (Grades 4 – 6)</option>
            <option>Intermediate & Senior (Grades 7 – 12)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-charcoal mb-1">Enrollment Status</label>
          <select class="w-full px-3 py-2 text-xs bg-canvas/40 border border-border rounded-lg font-medium text-charcoal">
            <option>Active Students Only</option>
            <option>Active + Conditional Enrollees</option>
            <option>Withdrawn & Alumni</option>
          </select>
        </div>
      </div>

      <!-- Step 3: Column Projections (Field Selectors) -->
      <div class="space-y-2">
        <div class="flex items-center justify-between">
          <label class="text-xs font-bold text-charcoal uppercase tracking-wider">2. Column Projections (Select & Reorder)</label>
          <button class="text-xs text-terracotta font-semibold hover:underline">Select All Fields</button>
        </div>
        <div class="p-4 bg-canvas/30 border border-border rounded-xl grid grid-cols-2 sm:grid-cols-3 gap-3 text-xs">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" checked class="w-4 h-4 rounded text-terracotta focus:ring-terracotta border-border">
            <span class="text-charcoal font-medium">Student Full Name</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" checked class="w-4 h-4 rounded text-terracotta focus:ring-terracotta border-border">
            <span class="text-charcoal font-medium">Student ID #</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" checked class="w-4 h-4 rounded text-terracotta focus:ring-terracotta border-border">
            <span class="text-charcoal font-medium">Current Grade & Homeroom</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" checked class="w-4 h-4 rounded text-terracotta focus:ring-terracotta border-border">
            <span class="text-charcoal font-medium">Primary Guardian Contacts</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" checked class="w-4 h-4 rounded text-terracotta focus:ring-terracotta border-border">
            <span class="text-charcoal font-medium">Attendance Rate (%)</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" checked class="w-4 h-4 rounded text-terracotta focus:ring-terracotta border-border">
            <span class="text-charcoal font-medium">Current Academic GPA / Tier</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" checked class="w-4 h-4 rounded text-terracotta focus:ring-terracotta border-border">
            <span class="text-charcoal font-medium">Outstanding Tuition Balance</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" checked class="w-4 h-4 rounded text-terracotta focus:ring-terracotta border-border">
            <span class="text-charcoal font-medium">Medical Alert Flags</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" class="w-4 h-4 rounded text-terracotta focus:ring-terracotta border-border">
            <span class="text-charcoal font-medium">Enrollment Intake Date</span>
          </label>
        </div>
      </div>

      <!-- Step 4: Export Format Selection -->
      <div class="space-y-2">
        <label class="text-xs font-bold text-charcoal uppercase tracking-wider block">3. Export Destination & Format</label>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
          <label class="p-3 rounded-xl border border-mint/50 bg-mint/10 flex items-center gap-3 cursor-pointer">
            <input type="radio" name="format" checked class="text-mint focus:ring-mint">
            <div>
              <span class="font-bold text-charcoal block">Microsoft Excel (.XLSX)</span>
              <span class="text-[10px] text-charcoal/60">Formatted workbook with pivot tables</span>
            </div>
          </label>

          <label class="p-3 rounded-xl border border-border bg-canvas/30 hover:bg-canvas flex items-center gap-3 cursor-pointer">
            <input type="radio" name="format" class="text-terracotta focus:ring-terracotta">
            <div>
              <span class="font-bold text-charcoal block">Standard CSV (.csv)</span>
              <span class="text-[10px] text-charcoal/60">Plain text for SIS or data warehouse</span>
            </div>
          </label>

          <label class="p-3 rounded-xl border border-border bg-canvas/30 hover:bg-canvas flex items-center gap-3 cursor-pointer">
            <input type="radio" name="format" class="text-terracotta focus:ring-terracotta">
            <div>
              <span class="font-bold text-charcoal block">Executive PDF Dossier (.pdf)</span>
              <span class="text-[10px] text-charcoal/60">Includes school crest & letterhead</span>
            </div>
          </label>
        </div>
      </div>

    </div>

    <!-- Modal Footer Actions -->
    <div class="px-6 py-4 bg-cream/30 border-t border-border flex items-center justify-between">
      <div class="flex items-center gap-2 text-xs text-charcoal/60">
        <span class="material-symbols-outlined text-sm text-mint">check_circle</span>
        Estimated query result: <strong>412 rows (approx. 1.2 MB)</strong>
      </div>
      <div class="flex items-center gap-3">
        <button class="px-4 py-2 rounded-xl border border-border text-xs font-semibold hover:bg-canvas text-charcoal">
          Save Query Template
        </button>
        <button class="px-5 py-2 rounded-xl bg-terracotta text-white text-xs font-semibold hover:bg-terracotta/90 transition shadow-sm flex items-center gap-1.5">
          <span class="material-symbols-outlined text-sm">download</span> Run Query & Download Report
        </button>
      </div>
    </div>

  </div>

</body>
</html>
