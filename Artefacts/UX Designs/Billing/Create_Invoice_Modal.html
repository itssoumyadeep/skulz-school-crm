<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Invoice Modal — School CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            canvas: '#FFF8F2',
            surface: '#FFFFFF',
            border: '#EAD8C7',
            charcoal: '#121417',
            muted: '#687787',
            terracotta: '#E07A5F',
            mint: '#90BE6D',
            marigold: '#FDBA3B',
            cerulean: '#64B5F6',
            lilac: '#B39DDB',
            cream: '#FAF0E6',
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['Fraunces', 'serif'],
          },
          boxShadow: {
            warm: '0 4px 20px -2px rgba(18, 20, 23, 0.05), 0 2px 6px -1px rgba(18, 20, 23, 0.03)',
            'warm-lg': '0 20px 40px -6px rgba(18, 20, 23, 0.12), 0 8px 16px -4px rgba(18, 20, 23, 0.06)',
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
      display: inline-flex;
      vertical-align: middle;
    }
    .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #E07A5F;
      box-shadow: 0 0 0 3px rgba(224, 122, 95, 0.18);
    }
  </style>
</head>
<body class="bg-canvas text-charcoal font-sans min-h-screen antialiased flex flex-col items-center justify-center p-4 sm:p-6 lg:p-8">

  <!-- Background Ambience -->
  <div class="fixed inset-0 pointer-events-none opacity-20 filter blur-[2px]">
    <div class="p-8 max-w-7xl mx-auto space-y-6">
      <div class="h-16 bg-white border border-border rounded-2xl"></div>
      <div class="h-96 bg-white border border-border rounded-2xl"></div>
    </div>
  </div>

  <!-- Modal Backdrop -->
  <div class="fixed inset-0 bg-charcoal/50 backdrop-blur-sm z-40 transition-opacity"></div>

  <!-- Create Invoice Dialog Window -->
  <div role="dialog" aria-modal="true" class="relative z-50 w-full max-w-3xl bg-white border border-border rounded-3xl shadow-warm-lg overflow-hidden flex flex-col max-h-[92vh]">

    <!-- Header -->
    <div class="bg-canvas/80 border-b border-border p-5 sm:p-6">
      <div class="flex items-center justify-between gap-4">
        <div class="flex items-center gap-3.5">
          <div class="w-12 h-12 rounded-2xl bg-terracotta/20 text-terracotta flex items-center justify-center font-serif text-lg font-bold shrink-0 border border-terracotta/30">
            <span class="material-symbols-outlined text-2xl text-terracotta">add_card</span>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h2 class="text-xl font-bold font-serif text-charcoal">Generate Student Fee Invoice</h2>
              <span class="px-2 py-0.5 rounded-full bg-cream text-charcoal text-[10px] font-bold border border-border">Bursar Desk</span>
            </div>
            <p class="text-xs text-muted mt-0.5">Itemize academic tuition, field trip excursions, and extracurricular program fees.</p>
          </div>
        </div>

        <a href="Invoice_Ledger_Widget.html" class="w-8 h-8 rounded-full bg-white border border-border flex items-center justify-center text-muted hover:text-charcoal transition-colors hover:bg-cream" title="Close">
          <span class="material-symbols-outlined text-lg">close</span>
        </a>
      </div>
    </div>

    <!-- Invoice Form Body -->
    <form id="createInvoiceForm" onsubmit="event.preventDefault(); emitInvoice();" class="flex-1 overflow-y-auto p-6 space-y-5 text-xs">

      <!-- Payer & Cohort Scope -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-charcoal mb-1">Target Student / Payer <span class="text-terracotta">*</span></label>
          <select class="w-full px-3 py-2 text-xs bg-canvas border border-border rounded-xl font-bold text-charcoal">
            <option selected>Sophia Claire Chen (#STU-2026-0891) &bull; Elena Vance</option>
            <option>Lucas Chen (#STU-2024-0034) &bull; Elena Vance</option>
            <option>Noah Kim (#STU-2026-0504) &bull; Grace Kim</option>
            <option>Entire Grade 2B Cohort (25 Students Batch)</option>
          </select>
        </div>

        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-charcoal mb-1">Invoice Due Date <span class="text-terracotta">*</span></label>
          <input type="date" value="2026-11-30" required class="w-full px-3 py-2 text-xs bg-canvas border border-border rounded-xl font-bold text-charcoal">
        </div>
      </div>

      <!-- Itemized Line Items Grid -->
      <div class="p-4 rounded-2xl border border-border bg-white space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold uppercase tracking-wider text-charcoal">Itemized Invoice Charges</span>
          <button type="button" onclick="addLineItem()" class="text-terracotta font-bold text-[11px] hover:underline flex items-center gap-1">
            <span class="material-symbols-outlined text-sm">add_circle</span> Add Line Item
          </button>
        </div>

        <div class="space-y-2" id="lineItemsContainer">
          <!-- Line 1 -->
          <div class="grid grid-cols-12 gap-2 items-center p-2 rounded-xl bg-canvas border border-border">
            <div class="col-span-6">
              <input type="text" value="Term 2 IB PYP Tuition Installment" class="w-full px-2 py-1 text-xs bg-white border border-border rounded-lg font-semibold text-charcoal">
            </div>
            <div class="col-span-2">
              <input type="number" value="1" class="w-full px-2 py-1 text-xs bg-white border border-border rounded-lg text-center font-bold">
            </div>
            <div class="col-span-3">
              <div class="flex items-center gap-1">
                <span>$</span>
                <input type="number" value="4440" oninput="recalcTotal()" class="line-price w-full px-2 py-1 text-xs bg-white border border-border rounded-lg font-bold text-charcoal">
              </div>
            </div>
            <div class="col-span-1 text-right">
              <button type="button" class="text-muted hover:text-terracotta"><span class="material-symbols-outlined text-base">delete</span></button>
            </div>
          </div>

          <!-- Line 2 -->
          <div class="grid grid-cols-12 gap-2 items-center p-2 rounded-xl bg-canvas border border-border">
            <div class="col-span-6">
              <input type="text" value="Ontario Science Centre Excursion &bull; Bus Transit" class="w-full px-2 py-1 text-xs bg-white border border-border rounded-lg font-semibold text-charcoal">
            </div>
            <div class="col-span-2">
              <input type="number" value="1" class="w-full px-2 py-1 text-xs bg-white border border-border rounded-lg text-center font-bold">
            </div>
            <div class="col-span-3">
              <div class="flex items-center gap-1">
                <span>$</span>
                <input type="number" value="65" oninput="recalcTotal()" class="line-price w-full px-2 py-1 text-xs bg-white border border-border rounded-lg font-bold text-charcoal">
              </div>
            </div>
            <div class="col-span-1 text-right">
              <button type="button" class="text-muted hover:text-terracotta"><span class="material-symbols-outlined text-base">delete</span></button>
            </div>
          </div>
        </div>

        <!-- Tax & Subtotal Strip -->
        <div class="pt-3 border-t border-border flex flex-col items-end space-y-1 text-xs">
          <div class="flex justify-between w-64 text-muted">
            <span>Subtotal:</span>
            <span class="font-bold text-charcoal" id="subtotalVal">$4,505.00</span>
          </div>
          <div class="flex justify-between w-64 text-mint font-semibold">
            <span>HST/GST (Exempt s. III ETA):</span>
            <span>$0.00</span>
          </div>
          <div class="flex justify-between w-64 text-sm font-extrabold text-charcoal pt-1 border-t border-border">
            <span>Total Payable:</span>
            <span class="font-serif text-base" id="totalVal">$4,505.00</span>
          </div>
        </div>
      </div>

      <!-- Payment Terms & Dunning Clauses -->
      <div>
        <label class="block text-[11px] font-bold uppercase tracking-wider text-charcoal mb-1">Invoice Terms &amp; Settlement Directives</label>
        <textarea rows="2" class="w-full px-3 py-2 text-xs bg-canvas border border-border rounded-xl text-charcoal leading-relaxed">Payable via Stripe Elements online parent portal or electronic pre-authorized debit (PAD). Overdue accounts accrue 1.5% monthly compound fee 15 days post due-date.</textarea>
      </div>

      <!-- Action Footer -->
      <div class="pt-2 flex items-center justify-between border-t border-border">
        <a href="Invoice_Ledger_Widget.html" class="px-4 py-2.5 rounded-xl border border-border bg-white text-charcoal font-semibold text-xs hover:bg-cream transition-colors">
          Cancel
        </a>
        <button type="submit" class="px-6 py-2.5 rounded-xl bg-terracotta text-white font-bold text-xs hover:bg-terracotta/90 transition-all flex items-center gap-1.5 shadow-warm">
          <span class="material-symbols-outlined text-sm">send</span>
          Issue Invoice &amp; Dispatch to Parent Portal
        </button>
      </div>
    </form>
  </div>

  <script>
    function recalcTotal() {
      let sum = 0;
      document.querySelectorAll('.line-price').forEach(inp => {
        sum += parseFloat(inp.value) || 0;
      });
      document.getElementById('subtotalVal').textContent = `$${sum.toLocaleString()}.00`;
      document.getElementById('totalVal').textContent = `$${sum.toLocaleString()}.00`;
    }

    function addLineItem() {
      alert('New charge row appended.');
    }

    function emitInvoice() {
      alert('Invoice #INV-2026-0922 issued successfully!\nNotification dispatched to Dr. Elena Vance-Chen.');
      window.location.href = 'Invoice_Ledger_Widget.html';
    }
  </script>
</body>
</html>
